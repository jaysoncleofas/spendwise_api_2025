# Nginx Configuration for SpendWise API
# Copy this into Laravel Forge's Nginx configuration editor
# Replace placeholders with your actual domains

server {
    listen 80;
    listen [::]:80;
    server_name spendwise-api.on-forge.com;
    
    # If SSL is configured by Forge, remove the above and use:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # (Forge automatically configures SSL certificates)
    
    # Logs (Forge typically handles this, but good to have)
    access_log /var/log/nginx/spendwise-api-access.log;
    error_log /var/log/nginx/spendwise-api-error.log;

    # Increase timeouts for large requests (file uploads)
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    client_max_body_size 10M;  # For receipt uploads

    # Handle preflight OPTIONS requests at Nginx level
    location / {
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://spendwise.on-forge.com' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Proxy to FastAPI backend
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Don't cache API responses
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        proxy_buffering off;
    }

    # Serve static upload files
    location /uploads/ {
        alias /home/forge/spendwise-api.on-forge.com/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # CORS headers for static files
        add_header 'Access-Control-Allow-Origin' 'https://spendwise.on-forge.com' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
}

# IMPORTANT NOTES:
# 1. Replace 'spendwise-api.on-forge.com' with your actual backend domain
# 2. Replace 'https://spendwise.on-forge.com' with your actual frontend domain
# 3. Make sure the path '/home/forge/spendwise-api.on-forge.com/uploads/' matches your actual uploads directory
# 4. Laravel Forge may add SSL configuration automatically - that's fine
# 5. After updating, test with: sudo nginx -t
# 6. Then reload: sudo systemctl reload nginx


